<!DOCTYPE html>
<html lang="en">
<head>

    <title>Sales Orders</title>
    <link rel="stylesheet" href="/static/pharmacist_styles.css">
    <a href="/pharmacist/dashboard">Visit Dashboard</a>
</head>
<body>
    <h1>All Sales</h1>
    
    <table>
     <thead>
        <tr>
            <th>Client</th>
            <th>Date</th>
            <th>Total</th>
            <th>More Details</th>
        </tr>
     </thead>
     <tbody>
        
        {% for sale in sales %}

        <tr>
            <td>{{sale.client}}</td>
            <td>{{sale.date}}</td>
            <td>{{sale.total}}</td>
            <td><a href="/pharmacist/sale_details?sale_id={{sale.id}}">Sale Details</a></td>
        </tr>

        {% endfor %}
     </tbody>   
    </table>
</body>
</html>
