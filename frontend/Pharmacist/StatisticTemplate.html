<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/pharmacist_styles.css">
    <title>Daily Statistics</title>
</head>

<body>

    <h1>Daily Statistics</h1>

    <div>
        <h2>Number of Sales</h2>
        <p>{{ sales_number }}</p>
    </div>

    <div>
        <h2>Revenues</h2>
        <p>{{ revenues }}</p>
    </div>

    <div>
        <h2>Profits</h2>
        <p>{{ profits }}</p>
    </div>

    <div>
        <h2>Costs</h2>
        <p>{{ costs }}</p>
    </div>

</body>
</html>
