<!DOCTYPE html>
<html lang="en">
<head>

    <title>Login</title>
</head>
<body>

        {% if message %}
        <div id="alert">
       <p>{{message}}</p>
       <button onclick="closealert()">Ok</button>
    </div>
    {% endif %}
    
    <form action="/pharmacist/login" method="post">
        Email: <input type="text" name="email"><br><br>
        Password: <input type="text" name="password"><br><br>
        <button type="submit">Login</button>
    </form>
    <p>You dont have account ? <a href="/pharmacist/register">register</a></p>
</body>
<script>
    function closealert() {
       const alert=document.getElementById("alert").style.display="none"
    }
</script>
</html>
