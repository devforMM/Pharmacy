<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="/static/pharmacist_styles.css">
    <title>Register</title>
</head>
<body>
    {% if Error_Message %}
    <div id="alert">
       <p>{{Error_Message}}</p>
       <button onclick="close_alert()">Ok</button>
    </div>
    {% endif %}
    Register Pharmacist
    <form action="/pharmacist/register" method="post">
        First Name: <input type="text" name="first_name"><br><br>
        Lasr Name: <input type="text" name="last_name"><br><br>
        Email: <input type="text" name="email"><br><br>
        Password: <input type="password" name="password"><br><br>
        Phone Number: <input type="password" name="phone_number"><br><br>
        Adress: <input type="text" name="adress"><br><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have ? <a href="/pharmacist/login">Login</a></p>
    
</body>
<script>
    function close_alert(){
        alert=document.getElementById("alert").style.display="none"
    }
</script>
</html>
