<!DOCTYPE html>
<html lang="en">
<head>
    <title>Low Stock</title>
</head>
<body>
    
    <h1>Products with Low Stock</h1>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Reference</th>
            <th>Quantity </th>
        </tr>
        </thead>
        <tbody>
            {% for stock in low_stock %}
            <tr>
                <td>{{stock.product_name}}</td>
                <td>{{stock.reference}}</td>
                <td>{{stock.quantity}}</td>
            </tr>
            {% endfor % }
        </tbody>

        
    </table>
</body>
</html>
