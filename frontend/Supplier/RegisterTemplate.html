<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/supplier_styles.css">
    <title>Register</title>
</head>
<h1>Register Supplier</h1>
<body>
    {% if Error_Message %}
    <div id="alert">
       <p>{{Error_Message}}</p>
       <button onclick="close_alert()">Ok</button>
    </div>
    {% endif %}
    <form action="/supplier/register" method="post">
         Email: <input type="text" name="email"><br><br>
         Password: <input type="text" name="password"><br><br>
         First Name: <input type="text" name="first_name"><br><br>
         Last Name: <input type="text" name="last_name"><br><br>
         Adress: <input type="text" name="adress"><br><br>
         Phone Number <input type="text" name="phone_number"><br><br>
         <button type="submit">Register</button>
    </form>
    <p>Already have account <a href="/supplier/login">Login</a></p>
</body>
<script>
    function close_alert(){
        alert=document.getElementById("alert").style.display="none"
    }
</script>
</html>
