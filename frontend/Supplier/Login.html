<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login </title>
</head>
<body>
    {% if Error_Message %}
        <div id="alert">
       <p>{{Error_Message}}</p>
       <button onclick="closealert()">Ok</button>
    </div>
    {% endif %}

    <form action="/supplier/login">
        Email: <input type="text" name="email"><br><br>
        Password: <input type="text" name="password"><br><br>
        <button type="submit">Login</button>
    </form>
    <p>You Dont Have account <a href="/supplier/register">Register</a></p>
</body>
<script>
    function closealert() {
       const alert=document.getElementById("alert").style.display="none"
    }
</script>
</html>
